<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Snip</title>
  <meta name="description" content="Sign in to Snip to create and manage your short links." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>" />
</head>
<body>
  <div class="bg-glow"></div>

  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/"><span class="brand-mark">✂️</span> Snip</a>
      <nav class="nav-links">
        <a href="/#features">Features</a>
        <a href="/#how">How it works</a>
        <a href="/#api">API</a>
      </nav>
      <div class="nav-right"></div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1 id="auth-title">Welcome back</h1>
      <p class="section-sub auth-sub">Sign in to create links under your account and manage them anytime.</p>

      <div class="auth-tabs">
        <button id="tab-signin" class="auth-tab active" type="button">Sign in</button>
        <button id="tab-register" class="auth-tab" type="button">Create account</button>
      </div>

      <div id="auth-status" class="status hidden"></div>

      <form id="signin-form" class="auth-form" autocomplete="on">
        <label class="field">
          <span>Email</span>
          <input id="signin-email" type="email" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="signin-password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <form id="register-form" class="auth-form hidden" autocomplete="on">
        <label class="field">
          <span>Name</span>
          <input id="register-name" type="text" autocomplete="name" placeholder="Your name" />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="register-email" type="email" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>Password <em>(min 8 characters)</em></span>
          <input id="register-password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••" />
        </label>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>

      <div id="sso-block" class="hidden">
        <div class="auth-divider"><span>or</span></div>
        <a id="google-btn" class="btn btn-google btn-block" href="/oauth2/authorization/google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
          Continue with Google
        </a>
      </div>

      <p class="auth-note"><a href="/">← Back to home</a></p>
    </div>
  </main>

  <script src="/login.js"></script>
</body>
</html>
