server:
  port: ${PORT:8080}

spring:
  application:
    name: url-shortener
  datasource:
    # Credential discovery: if DATABASE_URL is in postgres://user:pass@host:port/db
    # form (Render/Heroku/Railway style), DatabaseUrlEnvironmentPostProcessor converts
    # it to a JDBC URL and splits out the username/password automatically. A JDBC URL
    # (or DB_USERNAME/DB_PASSWORD) is used as-is when DATABASE_URL is absent.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # SASL/PLAIN (e.g. Redpanda Cloud / Upstash) is wired in KafkaConfig
    # only when KAFKA_SASL_JAAS_CONFIG is set.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  base-url: ${BASE_URL:http://localhost:8080}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:20}
  cache-ttl-hours: ${CACHE_TTL_HOURS:24}
  click-topic: ${KAFKA_CLICK_TOPIC:url-clicks}
  code-min-length: ${CODE_MIN_LENGTH:6}
  # Set KAFKA_ENABLED=false to run without a broker. Clicks are then counted
  # with a direct atomic DB update instead of the Kafka pipeline — useful for
  # free-tier deploys where managed Kafka isn't available. When disabled, also
  # set MANAGEMENT_HEALTH_KAFKA_ENABLED=false so the health check doesn't fail.
  kafka-enabled: ${KAFKA_ENABLED:true}

logging:
  level:
    com.iamamansid.urlshortener: ${LOG_LEVEL:INFO}
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
